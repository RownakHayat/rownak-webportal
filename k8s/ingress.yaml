apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rownak-webportal
  namespace: dev-webportal
  annotations:
    # Uses nginx ingress controller — swap for traefik/alb as needed
    kubernetes.io/ingress.class: "nginx"
    # Automatic TLS via cert-manager (Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - yourdomain.com          # ← replace with your domain
      secretName: rownak-webportal-tls
  rules:
    - host: yourdomain.com        # ← replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rownak-webportal
                port:
                  number: 80
