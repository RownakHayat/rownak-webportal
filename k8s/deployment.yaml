apiVersion: apps/v1
kind: Deployment
metadata:
  name: rownak-webportal
  namespace: rownak-webportal
  labels:
    app: rownak-webportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rownak-webportal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploys
  template:
    metadata:
      labels:
        app: rownak-webportal
    spec:
      # Pull the image from Docker Hub (updated by CI/CD)
      containers:
        - name: rownak-webportal
          image: DOCKER_USERNAME/rownak-webportal:latest   # replaced by CI/CD
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          # Liveness probe — restart the pod if the app hangs
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Readiness probe — only send traffic when the app is ready
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
